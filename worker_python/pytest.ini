[pytest]
minversion = 8.0
testpaths = curation/tests training/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Testes minimos de integridade de hardware e drivers CUDA (1 passo, dados sinteticos)
    slow: Treinos completos e benchmarks pesados de longa duracao
    property: Testes baseados em propriedades com Hypothesis
    unit: Testes unitarios puros sem I/O ou GPU
addopts = -ra -q
